# Default values for greatdb.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

image:
  registry: localhost:5001
  repository: apecloud/greatdb
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "8.0.32"
  prom:
    pullPolicy: IfNotPresent
    exporter:
      repository: apecloud/mysqld-exporter
      tag: v0.14.0

## @param componentServiceVersion define default serviceVersion of each Component
defaultServiceVersion:
  greatdb: 8.0.32

## MySQL Authentication parameters
auth:
  ## MYSQL_ROOT_HOST
  rootHost: "%"
  ## @param auth.createDatabase Whether to create the .Values.auth.database or not
  ##
  createDatabase: true
  ## @param auth.database Name for a custom database to create
  ## MYSQL_DATABASE
  database: "greatdb"

nameOverride: ""
fullnameOverride: ""

## Service settings
service:
  type: ClusterIP
  port: 3306
  nodePort: null

## Persistence settings
persistence:
  enabled: true
  storageClass: ""
  size: 8Gi
  accessModes:
    - ReadWriteOnce

## Resources settings
resources:
  limits:
    cpu: 1000m
    memory: 1Gi
  requests:
    cpu: 100m
    memory: 256Mi

## Data mount path
dataMountPath: /var/lib/mysql

## XtraBackup settings
xtraBackup:
  registry: localhost:5001
  repository: apecloud/percona-xtrabackup
  tag: "8.0"

## Node selector
nodeSelector: {}

tolerations: []

affinity: {}

## Role probe settings
roleProbe:
  periodSeconds: 10
  timeoutSeconds: 5

## Replication settings
replication:
  replicationUser: replication