apiVersion: dataprotection.kubeblocks.io/v1alpha1
kind: ActionSet
metadata:
  name: greatdb-xtrabackup-br
  labels:
    {{- include "greatdb.labels" . | nindent 4 }}
spec:
  backupType: Full
  env:
  - name: DATA_DIR
    value: "{{ .Values.dataMountPath }}"
  - name: MYSQL_DIR
    value: "{{ .Values.dataMountPath }}"
  - name: IMAGE_TAG
    value: "8.0"
  - name: BACKUP_FOR_STANDBY
    value: "false"
  backup:
    preBackup: []
    postBackup: []
    backupData:
      image: {{ .Values.xtraBackup.registry | default ( .Values.image.registry | default "docker.io" ) }}/{{ .Values.xtraBackup.repository }}:$(IMAGE_TAG)
      runOnTargetPodNode: true
      command:
      - bash
      - -c
      - |
        {{- .Files.Get "dataprotection/backup.sh" | nindent 8 }}
      syncProgress:
        enabled: true
        intervalSeconds: 5
  restore:
    prepareData:
      image: {{ .Values.xtraBackup.registry | default ( .Values.image.registry | default "docker.io" ) }}/{{ .Values.xtraBackup.repository }}:$(IMAGE_TAG)
      command:
      - bash
      - -c
      - |
        {{- .Files.Get "dataprotection/restore.sh" | nindent 8 }}
    postReady:
    - exec:
        command:
        - sh
        - -c
        - |
          rm -rf {{ .Values.dataMountPath }}/.restore_new_cluster